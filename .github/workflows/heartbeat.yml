name: Supabase heartbeat

on:
  schedule:
    - cron: '0 5 */2 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive_ping()
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $HTTP_CODE: $(cat /tmp/response.txt)"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Heartbeat failed"
            exit 1
          fi
          echo "::notice::alive"
